<app-page-header
  title="Residents"
  subtitle="Beneficiary and household registry for Taytay, Rizal."
/>

<div class="card">
  <div class="filters">
    <label class="filters__field">
      <span class="filters__label">Search</span>
      <input
        type="search"
        class="filters__input"
        placeholder="Name, address or mobile number"
        (input)="onSearch($event)"
      />
    </label>

    <label class="filters__field">
      <span class="filters__label">Barangay</span>
      <select class="filters__input" (change)="onBarangayChange($event)">
        <option value="">All barangays</option>
        @for (barangay of barangays; track barangay.id) {
          <option [value]="barangay.id">{{ barangay.name }}</option>
        }
      </select>
    </label>

    @if (hasFilters()) {
      <button type="button" class="btn" (click)="clearFilters()">Clear filters</button>
    }
  </div>

  <app-data-table
    caption="Residents registered with the MSWDO"
    [columns]="columns()"
    [rows]="rows()"
    [rowKey]="rowKey"
    [loading]="isLoading()"
    [page]="page()"
    [sort]="sort()"
    [emptyVariant]="hasFilters() ? 'no-results' : 'empty'"
    [emptyHeading]="hasFilters() ? 'No residents match those filters' : 'No residents yet'"
    [emptyMessage]="
      hasFilters()
        ? 'Try a different spelling, or clear the filters to see every record.'
        : 'Residents appear here once they have been registered at intake.'
    "
    [emptyActionLabel]="hasFilters() ? 'Clear filters' : null"
    (sortChanged)="onSortChanged($event)"
    (pageChanged)="onPageChanged($event)"
    (emptyActionSelected)="clearFilters()"
  />
</div>

<ng-template #sectorsCell let-resident>
  <span class="sectors">
    @for (sector of sectorsOf(resident); track sector) {
      <span class="sectors__chip">{{ sector }}</span>
    } @empty {
      <span class="sectors__none">—</span>
    }
  </span>
</ng-template>
