<app-route-progress />

<div class="shell" [class.shell--nav-open]="navOpen()">
  <a class="skip-link" href="#main-content">{{ copy.skipToContent }}</a>

  <!-- Before the nav and before the content: an officer who cannot save needs
       to know before they spend five minutes typing, not after. -->
  <app-connection-banner class="shell__banner" />

  <!-- Compact only: dismisses the drawer without needing to hit the toggle. -->
  @if (isCompact() && navOpen()) {
    <button
      type="button"
      class="shell__scrim"
      [attr.aria-label]="copy.navToggleClose"
      (click)="closeNav()"
    ></button>
  }

  <aside
    #sidebar
    id="app-sidebar"
    class="shell__sidebar motion-transform"
    [class.shell__sidebar--open]="navOpen()"
    [attr.role]="isCompact() ? 'dialog' : null"
    [attr.aria-modal]="isCompact() && navOpen() ? 'true' : null"
    [attr.aria-label]="copy.navLandmark"
    [attr.tabindex]="isCompact() ? -1 : null"
    [attr.inert]="isCompact() && !navOpen() ? '' : null"
  >
    <div class="shell__brand">
      <app-brand-mark tone="dark" sealSize="md" secondaryLine="unit" priority />
    </div>

    <app-nav class="shell__nav" (navigated)="closeNav()" />

    <!-- Identity, appearance and sign-out live here rather than in the topbar so
         they stay reachable at every width — see the note in AppTopbar. -->
    <footer class="shell__account">
      <div class="shell__identity">
        @if (initials(); as letters) {
          <span class="shell__avatar" aria-hidden="true">{{ letters }}</span>
        }
        <span class="shell__identity-text">
          <span class="shell__account-name">{{ session.displayName() }}</span>
          <span class="shell__account-meta"
            >{{ session.user()?.roleLabel }} · {{ scopeLabel() }}</span
          >
        </span>
      </div>
      <app-theme-switch />
      <button type="button" class="btn shell__sign-out" (click)="signOut()">
        <app-icon name="signOut" [size]="16" [stroke]="2" />
        {{ copy.signOut }}
      </button>
    </footer>
  </aside>

  <div class="shell__main">
    <app-topbar
      [navOpen]="navOpen()"
      (navToggled)="toggleNav()"
      (searchActivated)="onSearchActivated()"
      (inboxOpened)="openInbox()"
    />

    <main id="main-content" class="shell__content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<app-drawer
  [(open)]="inboxOpen"
  [heading]="copy.notificationsHeading"
  [description]="copy.notificationsDescription"
>
  <app-notification-list drawer-body />

  <button
    drawer-actions
    type="button"
    class="btn"
    [disabled]="notifications.unreadCount() === 0"
    (click)="notifications.markAllRead()"
  >
    {{ copy.markAllRead }}
  </button>
</app-drawer>
