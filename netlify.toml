# Hosting configuration for the MSWDO staff console.
#
# THIS FILE IS A SECURITY CONTROL, NOT DEPLOYMENT PLUMBING.
#
# The integration sweep recorded F-09: no hosting configuration of any kind existed in
# this repository. That is not a gap in polish. ADR 0005 and ADR 0006 both name a strict
# Content-Security-Policy among the mitigations for the XSS exposure that bearer-token
# authentication carries, and the backend's own deployment topology states it plainly:
#
#   "If the policy below is not deployed, the residual risk both ADRs accepted is
#    unmitigated, not merely undocumented."
#
# ADR 0006 holds the access token in memory precisely so that injected script cannot read
# a persisted credential — but it can still read a variable. The CSP is what closes that,
# so until this file is deployed the console's authentication model is unsound as
# deployed, however correct the code is.
#
# It lives in the repository rather than in a dashboard so that it is reviewed like code:
# a weakened directive shows up in a diff, where clicking one into a hosting console shows
# up nowhere.
#
# ── What Netlify serves: the staging console, in every context (DL-206) ──────────────
#
# The Netlify project `taytayadmin` (https://taytayadmin.netlify.app) is a staging console.
# There is no production API yet, so a production build here could reach nothing. Every
# context builds `--configuration staging`, which calls the staging API on
# LGUIDS-SHARED-LINODE — the same one the Linode staging console calls.
#
# Netlify applies `[[headers]]` to every context; it cannot scope them ("headers set in the
# netlify.toml are global for all builds and cannot be scoped for specific branches or deploy
# contexts", docs.netlify.com). So there is ONE policy below, and it must name the API of the
# configuration built here. `check:environments` holds the two together.
#
# When a production API exists: change the command to the production configuration and the
# policy's API origin in the same commit, or split the policy per context with Netlify's
# documented workaround (a `_headers` file per context, copied in by each context's command).

[build]
  command = "npx ng build --configuration staging"
  publish = "dist/taytay-social-welfare/browser"

# ── The style nonce ──────────────────────────────────────────────────────────────────
#
# Angular injects component styles as <style> blocks, and the policy below admits only those
# carrying this response's nonce. A static host cannot mint one, so this edge function does:
# it adds `ngCspNonce` to <app-root> and `'nonce-…'` to `style-src` in the same response, and
# refuses an HTML page that arrives without a policy (DL-172, DL-206). Assets are excluded:
# a policy only governs a document.
[[edge_functions]]
  function = "csp-nonce"
  path = "/*"
  excludedPath = ["/*.js", "/*.css", "/*.png", "/*.svg", "/*.ico", "/*.webp", "/*.woff2", "/media/*"]

# ── Single-page application routing ──────────────────────────────────────────────────
#
# Without this, every deep link 404s: a bookmarked case URL, and every link a caseworker
# pastes to a colleague. The console owns its routes, so an unknown path is served the
# shell and the router decides — including the 404 screen, which is a decision the
# application makes rather than the host.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────────────────
#
# Applied to every path. The CSP is the baseline from
# `taytay-backend/docs/architecture/deployment-topology.md`, unchanged.
#
# `connect-src` names ONE API origin and the identity provider's TWO endpoints — Firebase
# Authentication's sign-in (`identitytoolkit.googleapis.com`) and token refresh
# (`securetoken.googleapis.com`), which staff sign-in calls directly (DL-166). Exact origins,
# never a wildcard: `*.googleapis.com` would admit every Google API, storage buckets included,
# as a place an injected script could send a token. Never the production API from a staging or
# preview host — a preview that can reach production contradicts the whole point of a preview.
# `check:headers` holds every policy to exactly these sources.
#
# `style-src` deliberately does NOT carry 'unsafe-inline'. Angular emits component styles
# as inline <style> blocks, and the sanctioned answer is `ngCspNonce` with a per-response
# nonce (TAB 13). Adding 'unsafe-inline' here to make the build work is the exact silent
# weakening the topology document warns against: it re-opens the injection path the whole
# policy exists to close.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://taytay-api.139-162-51-165.sslip.io https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; upgrade-insecure-requests"

    # A staging console carries test data and unreleased screens. Keeping it out of search
    # results is not secrecy; it is not publishing a half-built welfare console under the
    # municipality's name.
    X-Robots-Tag = "noindex, nofollow"

    # A referrer carrying a case identifier to a third party is a personal-data leak.
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

    # Nothing here needs a camera, a microphone, a location or a payment handler. A
    # console that cannot ask is a console that cannot be tricked into asking.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    # DELIBERATELY ABSENT: Strict-Transport-Security.
    #
    # HSTS cannot be undone from the server — a browser that has seen it will refuse
    # plain HTTP for the whole max-age, and a certificate problem then locks the office
    # out of its own console with no server-side remedy. It is added in TAB 13, AFTER the
    # custom domain and certificate chain are confirmed, and that ordering is the
    # decision rather than an oversight.

# ── Caching ──────────────────────────────────────────────────────────────────────────
#
# The shell is never cached: a stale index.html pins a caseworker to an old bundle after
# a release, including a release that fixed something.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# Hashed assets are immutable by construction — the filename changes when the content
# does — so they are cached hard.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Angular emits fonts and images into /media with a content hash, on the same rule as the
# scripts above. Added in TAB 12: `_headers` and this file had drifted apart on caching,
# which is the exact failure `_headers`' own docblock warns about — the fallback file is
# the one that ships INSIDE the bundle, so on a host that reads it instead, the drift is
# what actually serves.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Deploy previews ──────────────────────────────────────────────────────────────────
#
# A preview gets a generated *.netlify.app origin, and builds the same staging configuration
# under the same policy as everything above, because headers cannot differ per context. It
# must never reach a production API: anybody can create a site on that domain. The staging API
# answers only the exact origins in its CORS_ALLOWED_ORIGINS, so a preview loads and cannot
# sign in until somebody adds its origin there — on purpose.
#
# This block used to carry its own `[[context.deploy-preview.headers]]` policy. Netlify
# ignores headers scoped to a context, so that policy never applied to any deploy (DL-206).
